<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje · Visão</title>
<link href="fonte.css" rel="stylesheet">
<link href="iris.css" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB7CF}a:hover{color:#A9D3E4}
.tema-escuro{--bg:#0D0C0A;--glow1:rgba(207,227,243,0.15);--glow2:rgba(95,157,184,0.16);--card:rgba(255,255,255,0.06);--card2:rgba(255,255,255,0.025);--card-shadow:none;--line:rgba(255,255,255,0.12);--line2:rgba(255,255,255,0.08);--tx:#F2F4F7;--tx2:#C5CBD3;--tx3:#8E959E;--chip:rgba(255,255,255,0.06);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#CFE3F3;--acc-dot:#CFE3F3;--acc-glow:rgba(207,227,243,0.35);--acc-soft:rgba(207,227,243,0.13);--acc-line:rgba(207,227,243,0.5);--cta:#F2F4F7;--cta-tx:#0D0C0A;--cta-glow:rgba(242,244,247,0.16);--nav:rgba(22,24,28,0.82);--nav-shadow:0 16px 40px rgba(0,0,0,0.45);--ok:#7FD1A6;--ok-tx:#7FD1A6;--warn:#F0A940;--warn-tx:#F0A940;--bad:#F0766B;--bad-tx:#F0766B;--bad-soft:rgba(240,118,107,0.13);--teal:#7FB7CF;--teal-soft:rgba(127,183,207,0.12);--badge-bad-bg:#F0766B;--badge-bad-tx:#1A0D0B;--bad-btn:linear-gradient(180deg,#F5918A,#E0645A);--bad-btn-tx:#1A0D0B;--ylw:#EBD35B;--ylw-tx:#EBD35B;--ylw-soft:rgba(235,211,91,0.13);--ylw-line:rgba(235,211,91,0.42)}
.tema-claro{--bg:#FAFBFC;--glow1:rgba(207,227,243,0.9);--glow2:rgba(95,157,184,0.14);--card:rgba(255,255,255,0.96);--card2:rgba(244,248,252,0.94);--card-shadow:0 10px 30px rgba(13,12,10,0.06);--line:rgba(13,12,10,0.13);--line2:rgba(13,12,10,0.07);--tx:#0D0C0A;--tx2:#45484D;--tx3:#5F636A;--chip:rgba(13,12,10,0.04);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#2F5E80;--acc-dot:#5B8DB3;--acc-glow:rgba(120,170,210,0.35);--acc-soft:rgba(207,227,243,0.6);--acc-line:#9DC2DE;--cta:#0D0C0A;--cta-tx:#FFFFFF;--cta-glow:rgba(13,12,10,0.18);--nav:rgba(255,255,255,0.9);--nav-shadow:0 14px 34px rgba(13,12,10,0.12);--ok:#3FAE6A;--ok-tx:#1E7B34;--warn:#F0A940;--warn-tx:#A05A00;--bad:#E0645A;--bad-tx:#C4141B;--bad-soft:rgba(224,100,90,0.12);--teal:#3E7F9C;--teal-soft:rgba(127,183,207,0.18);--badge-bad-bg:#C4141B;--badge-bad-tx:#FFFFFF;--bad-btn:linear-gradient(180deg,#D83A30,#B3241B);--bad-btn-tx:#FFFFFF;--ylw:#E2C232;--ylw-tx:#7A6500;--ylw-soft:rgba(226,194,50,0.18);--ylw-line:rgba(122,101,0,0.32)}
</style>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#050506}
#palco{width:1194px;height:834px;flex:none;transform-origin:center center;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.45)}
</style>
<!-- Backend (offline): dados simulados, regras, motor, modelo, armazenamento e ligação aos ecrãs -->
<script src="../dados.js"></script>
<script src="../../motor/regras.js"></script>
<script src="../../motor/motor.js"></script>
<script src="../../motor/modelo.js"></script>
<script src="../armazenamento.js"></script>
<script src="ligacao.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<div id="palco"><div id="raiz"></div></div>
<template id="dc-modelo">
<div class="{{ temaClasse }}" style="position: relative; width: 1194px; height: 834px; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: radial-gradient(52% 58% at 27% 38%, var(--glow1), rgba(0,0,0,0) 70%), radial-gradient(40% 45% at 92% 100%, var(--glow2), rgba(0,0,0,0) 70%), var(--bg)">

<div style="position: absolute; left: 40px; right: 40px; top: 28px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" style="fill: none; stroke: var(--acc-text); stroke-width: 1.6; stroke-linecap: round"><circle cx="14" cy="14" r="5"></circle><path d="M14 2v4M14 22v4M2 14h4M22 14h4M5.5 5.5l2.8 2.8M19.7 19.7l2.8 2.8M5.5 22.5l2.8-2.8M19.7 8.3l2.8-2.8"></path></svg>
<span style="font-size: 22px; font-weight: 500; letter-spacing: -0.3px; color: var(--tx)">Visão</span>
<span style="margin-left: 6px; font-size: 12px; font-weight: 700; color: var(--tx3); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px">{{ selo }}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{ toggleTema }}" aria-pressed="{{ claro }}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--chip); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<sc-if value="{{ escuro }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{ claro }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
{{ temaLabel }}</button>
<a href="Perfil.html" style="display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px 0 4px; border-radius: 20px; background: var(--chip); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; color: var(--tx); text-decoration: none">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: linear-gradient(135deg, #E6F1FA, #9DC2DE); color: #0D0C0A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ p.ini }}</span>{{ p.nome }}<span style="font-weight: 500; color: var(--tx3)">· Dia {{ p.dia }}</span></a>
</div>
</div>

<div aria-label="Dias de missão" role="group" style="position: absolute; left: 148px; top: 96px; display: flex; gap: 16px">
<sc-for list="{{ dias }}" as="d" hint-placeholder-count="5">
<span style="display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1px solid {{ d.border }}; background: {{ d.bg }}; box-shadow: {{ d.glow }}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: {{ d.peso }}; color: {{ d.cor }}">{{ d.n }}</span><span style="font-size: 12px; font-weight: {{ d.peso }}; color: {{ d.corLabel }}">{{ d.label }}</span></span>
</sc-for>
</div>

<div style="position: absolute; left: 110px; top: 128px; width: 420px; height: 420px; pointer-events: none">
<sc-if value="{{ irisOn.original }}" hint-placeholder-val="{{ true }}"><img src="assets/iris_glow.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.castanho }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_castanho.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.avela }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_avela.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.verde }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_verde.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.azul }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_azul.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.cinzento }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_cinzento.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
<sc-if value="{{ irisOn.ambar }}" hint-placeholder-val="{{ false }}"><img src="assets/iris_ambar.webp" alt="" aria-hidden="true" style="width: 420px; height: 420px"></sc-if>
</div>

<section aria-labelledby="rec-titulo" style="position: absolute; left: 60px; top: 500px; width: 520px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--tx2)"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: var(--acc-dot); box-shadow: 0 0 10px var(--acc-glow)"></span>Olá, {{ p.curto }} · recomendação de hoje</span>
<h1 id="rec-titulo" style="margin: 0; font-size: 34px; font-weight: 400; letter-spacing: -0.6px; color: var(--tx)">{{ rec.titulo }}</h1>
<p style="margin: 0; max-width: 440px; font-size: 15px; line-height: 1.5; color: var(--tx2)">{{ rec.texto }}</p>
<sc-if value="{{ naoVermelho }}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--tx2)">
<span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>5 min</span>
<span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 12h16M12 4v16"></path></svg>Preparação e 2 testes</span>
</span>
<a href="TesteRapido.html" style="margin-top: 6px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 24px; border-radius: 23px; background: var(--cta); color: var(--cta-tx); font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 30px var(--cta-glow)">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: currentColor"><path d="M7 4.5v15l13-7.5z"></path></svg>Começar</a>
</sc-if>
<sc-if value="{{ vermelho }}" hint-placeholder-val="{{ false }}">
<a href="Alerta.html" style="margin-top: 6px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 24px; border-radius: 23px; background: var(--bad-btn); color: var(--bad-btn-tx); font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 30px var(--bad-soft)">Abrir alerta</a>
</sc-if>
</section>

<div style="position: absolute; left: 640px; top: 104px; width: 514px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{ eventoPendente }}" hint-placeholder-val="{{ true }}">
<a href="Perfil.html" onClick="{{ abrirEvento }}" aria-label="Notificação: movimento da nave detectado. Abrir no perfil para responder." style="display: flex; align-items: center; gap: 14px; min-height: 72px; box-sizing: border-box; padding: 12px 18px 12px 14px; border-radius: 22px; background: radial-gradient(90% 140% at 0% 0%, var(--ylw-soft), rgba(0,0,0,0) 70%), linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--ylw-line); box-shadow: var(--card-shadow); text-decoration: none; color: var(--tx)">
<span aria-hidden="true" style="position: relative; width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--ylw-soft); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: var(--ylw-tx); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 12h3l2-5 4 10 2-5h7"></path></svg><span style="position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 5px; background: var(--ylw); box-shadow: 0 0 0 2px var(--bg)"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 12px; font-weight: 700; color: var(--ylw-tx)">Notificação · responde antes do próximo teste</span>
<span style="font-size: 16px; font-weight: 600; color: var(--tx)">Movimento da nave detectado</span>
<span style="font-size: 13px; color: var(--tx3)">Hoje · 10:42–10:43 UTC · toca para ver o gráfico e responder</span>
</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="flex: none; fill: none; stroke: var(--tx3); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-if>

<section aria-labelledby="olhos-titulo" style="padding: 22px 24px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="olhos-titulo" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--tx2)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Os teus olhos</h2>
<span style="font-size: 13px; color: var(--tx3)">{{ olhosSub }}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<a href="{{ olhosHref }}" style="display: flex; flex-direction: column; gap: 4px; padding-right: 20px; border-right: 1px solid var(--line2); text-decoration: none; color: var(--tx)">
<span style="font-size: 13px; color: var(--tx2)">Olho esquerdo</span>
<span style="font-size: 48px; font-weight: 300; letter-spacing: -1.5px; line-height: 1.1">{{ olhoEsq.valor }}<span style="font-size: 22px; font-weight: 400; color: var(--tx2)">{{ olhoEsq.uni }}</span></span>
<span style="display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: {{ olhoEsq.cor }}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: {{ olhoEsq.dot }}; box-shadow: 0 0 10px {{ olhoEsq.dot }}"></span>{{ olhoEsq.estado }}</span>
</a>
<a href="{{ olhosHref }}" style="display: flex; flex-direction: column; gap: 4px; padding-left: 22px; text-decoration: none; color: var(--tx)">
<span style="font-size: 13px; color: var(--tx2)">Olho direito</span>
<span style="font-size: 48px; font-weight: 300; letter-spacing: -1.5px; line-height: 1.1">{{ olhoDir.valor }}<span style="font-size: 22px; font-weight: 400; color: var(--tx2)">{{ olhoDir.uni }}</span></span>
<span style="display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: {{ olhoDir.cor }}"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: {{ olhoDir.dot }}; box-shadow: 0 0 10px {{ olhoDir.dot }}"></span>{{ olhoDir.estado }}</span>
</a>
</div>
<span style="font-size: 13px; line-height: 1.4; color: var(--tx3)">{{ olhosNota }}</span>
</section>

<section aria-label="Resumo do último teste rápido" style="padding: 18px 24px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 500; color: var(--tx)">{{ p.acu }}</span><span style="font-size: 13px; color: var(--tx3)">Acuidade</span></span>
<span style="display: flex; flex-direction: column; gap: 4px; padding-left: 18px; border-left: 1px solid var(--line2)"><span style="font-size: 22px; font-weight: 500; color: var(--tx)">{{ p.amsler }}</span><span style="font-size: 13px; color: var(--tx3)">Grelha de Amsler</span></span>
<span style="display: flex; flex-direction: column; gap: 4px; padding-left: 18px; border-left: 1px solid var(--line2)"><span style="font-size: 22px; font-weight: 600; color: var(--acc-text)">Dia {{ p.prox }}</span><span style="font-size: 13px; color: var(--tx3)">Próximo teste</span></span>
</section>

<section aria-label="Atalhos" style="padding: 6px 20px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column">
<a href="SANS.html" style="display: flex; align-items: center; gap: 14px; min-height: 62px; border-bottom: 1px solid var(--line2); text-decoration: none; color: var(--tx)">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--acc-soft); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: var(--acc-text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 500">Monitorização SANS</span><span style="font-size: 13px; color: var(--tx3)">{{ p.sans }}</span></span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="fill: none; stroke: var(--tx3); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="Alerta.html" style="display: flex; align-items: center; gap: 14px; min-height: 62px; text-decoration: none; color: var(--tx)">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--bad-soft); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: var(--bad-tx); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 16px; font-weight: 500">Alertas</span><span style="font-size: 13px; color: var(--tx3)">{{ alertasTxt }}</span></span>
<sc-if value="{{ vermelho }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; border-radius: 11px; background: var(--badge-bad-bg); color: var(--badge-bad-tx); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box">1</span></sc-if>
</a>
</section>
</div>

<div aria-hidden="true" style="position: absolute; left: -1500px; right: -1500px; top: 712px; bottom: -1500px; pointer-events: none; background: linear-gradient(180deg, transparent 0, var(--bg) 90px)"></div>
<nav aria-label="Secções da app" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 36px; background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line2); box-shadow: var(--nav-shadow)">
<a href="Hoje.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 52px; box-sizing: border-box; padding: 0 22px; border-radius: 26px; background: var(--acc); border: 1px solid var(--acc-line); color: var(--acc-tx); font-size: 15px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 24px var(--acc-glow)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Hoje</a>
<a href="TesteRapido.html" aria-label="Avaliações" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"></path></svg></a>
<a href="SANS.html" aria-label="Monitorização SANS" style="width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
<a href="Alerta.html" aria-label="Alertas" style="position: relative; width: 56px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: var(--tx2); text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><sc-if value="{{ navAlerta }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 13px; right: 16px; width: 8px; height: 8px; border-radius: 4px; background: var(--bad); box-shadow: 0 0 8px var(--bad)"></span></sc-if></a>
</nav>

</div>
</template>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tema: 'escuro', perfil: 'B', iris: 'original', resp: null };
  }
  componentDidMount() {
    const upd = {};
    try {
      const t = window.localStorage.getItem('visao-tema');
      const p = window.localStorage.getItem('visao-perfil');
      const i = window.localStorage.getItem('visao-iris');
      if (t === 'claro' || t === 'escuro') upd.tema = t;
      if (p === 'A' || p === 'B' || p === 'C') upd.perfil = p;
      if (i) upd.iris = i;
      const r = window.localStorage.getItem('visao-evento-' + (upd.perfil || this.state.perfil));
      if (r === 'sim' || r === 'nao' || r === 'naosei') upd.resp = r;
    } catch (e) {}
    this.setState(upd);
    this.ouvir = (ev) => {
      if (!ev) return;
      if (ev.key === 'visao-tema' && (ev.newValue === 'claro' || ev.newValue === 'escuro')) this.setState({ tema: ev.newValue });
      if (ev.key === 'visao-perfil' && (ev.newValue === 'A' || ev.newValue === 'B' || ev.newValue === 'C')) {
        let r = null;
        try { r = window.localStorage.getItem('visao-evento-' + ev.newValue); } catch (e) {}
        this.setState({ perfil: ev.newValue, resp: r });
      }
      if (ev.key === 'visao-iris' && ev.newValue) this.setState({ iris: ev.newValue });
      if (ev.key === 'visao-evento-' + this.state.perfil) this.setState({ resp: ev.newValue });
    };
    try { window.addEventListener('storage', this.ouvir); } catch (e) {}
  }
  componentWillUnmount() {
    try { window.removeEventListener('storage', this.ouvir); } catch (e) {}
  }
  renderVals() {
    const s = this.state;
    const perfis = {
      A: { nome: 'Marta Silveira', curto: 'Marta', ini: 'MS', dia: 60, esq: 6.9, dir: 5.2, nEsq: 0, nDir: 0, lim: 12.5, prox: 67, acu: '5 de 5', amsler: 'Igual',
        sans: 'Linha temporal dos teus exames', alertas: 'Nenhum activo · 1 resolvido' },
      B: { nome: 'Daniel Cossa', curto: 'Daniel', ini: 'DC', dia: 90, esq: 17.0, dir: 12.1, nEsq: 1, nDir: 0, lim: 14.7, prox: 93, acu: 'OE 4 de 5', amsler: '2 zonas OE',
        sans: 'Linha temporal dos teus exames', alertas: '3 para revisão médica' },
      C: { nome: 'Sofia Lindqvist', curto: 'Sofia', ini: 'SL', dia: 84, esq: 52.9, dir: 24.6, nEsq: 2, nDir: 2, lim: 14.4, prox: 85, acu: 'OE 3 de 5', amsler: 'Centro OE',
        sans: 'Linha temporal dos teus exames', alertas: '1 prioritário · 2 para revisão' }
    };
    // Perfil real (equipa): tudo vem dos testes guardados no aparelho e do motor de regras.
    const R = window.Visao ? window.Visao.resumoHoje() : null;
    const p = R ? R.p : (perfis[s.perfil] || perfis.B);
    const fmt = (x) => x.toFixed(1).replace('.', ',');
    const estados = [
      { estado: 'Verde · rotina', cor: 'var(--ok-tx)', dot: 'var(--ok)' },
      { estado: 'Laranja · revisão recomendada', cor: 'var(--warn-tx)', dot: 'var(--warn)' },
      { estado: 'Vermelho · prioridade clínica', cor: 'var(--bad-tx)', dot: 'var(--bad)' }
    ];
    const nivel = R ? R.nivel : Math.max(p.nEsq, p.nDir);
    const recs = [
      { titulo: 'Tudo dentro da tua base', texto: 'Os teus olhos estão estáveis. O próximo teste rápido é no dia ' + p.prox + '.' },
      { titulo: 'Repete os testes rápidos', texto: 'O olho esquerdo mudou face à tua base. A equipa médica vai rever e repetir os testes ajuda a confirmar.' },
      { titulo: 'Avisa o médico de voo', texto: 'Há uma alteração prioritária face à tua base. O pacote para a Terra está pronto.' }
    ];
    const dias = [];
    for (let k = -2; k <= 2; k++) {
      const hoje = k === 0;
      dias.push({
        n: p.dia + k,
        label: hoje ? 'Hoje' : 'Dia',
        bg: hoje ? 'var(--acc)' : 'transparent',
        border: hoje ? 'var(--acc-line)' : 'var(--line)',
        glow: hoje ? '0 0 28px var(--acc-glow)' : 'none',
        cor: hoje ? 'var(--acc-tx)' : 'var(--tx2)',
        corLabel: hoje ? 'var(--acc-text)' : 'var(--tx3)',
        peso: hoje ? 700 : 500
      });
    }
    const tipos = ['original', 'castanho', 'avela', 'verde', 'azul', 'cinzento', 'ambar'];
    const irisAtual = tipos.indexOf(s.iris) >= 0 ? s.iris : 'original';
    const irisOn = {};
    tipos.forEach((t) => { irisOn[t] = t === irisAtual; });
    const claro = s.tema === 'claro';
    return {
      temaClasse: claro ? 'tema-claro' : 'tema-escuro',
      selo: window.Visao ? window.Visao.selo() : 'Dados simulados',
      claro: claro,
      escuro: !claro,
      temaLabel: claro ? 'Modo escuro' : 'Modo claro',
      toggleTema: () => {
        const n = this.state.tema === 'escuro' ? 'claro' : 'escuro';
        this.setState({ tema: n });
        try { window.localStorage.setItem('visao-tema', n); } catch (e) {}
      },
      p: R ? R.p : { nome: p.nome, curto: p.curto, ini: p.ini, dia: p.dia, prox: p.prox, acu: p.acu, amsler: p.amsler, sans: p.sans, limTxt: fmt(p.lim) },
      olhosSub: R ? R.olhosSub : 'Último OCT · dia ' + p.dia,
      olhosHref: R ? 'SANS.html' : 'Tendencia.html',
      olhosNota: R ? R.olhosNota : 'Variação da retina face à tua base pré-voo. Referência simulada para o dia ' + p.dia + ': até +' + fmt(p.lim) + '%.',
      dias: dias,
      irisOn: irisOn,
      rec: R ? R.rec : recs[nivel],
      vermelho: nivel === 2,
      naoVermelho: nivel !== 2,
      olhoEsq: R ? R.olhoEsq : Object.assign({ valor: '+' + fmt(p.esq), uni: '%' }, estados[p.nEsq]),
      olhoDir: R ? R.olhoDir : Object.assign({ valor: '+' + fmt(p.dir), uni: '%' }, estados[p.nDir]),
      alertasTxt: R ? R.alertas : p.alertas,
      navAlerta: nivel === 2,
      eventoPendente: R ? false : !s.resp,
      abrirEvento: () => { try { window.localStorage.setItem('visao-abrir', 'eventos'); } catch (e) {} }
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
