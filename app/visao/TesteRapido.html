<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliações · Visão</title>
<link href="fonte.css" rel="stylesheet">
<link href="iris.css" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB7CF}a:hover{color:#A9D3E4}
button:disabled{cursor:default}
.tema-escuro{--bg:#0D0C0A;--glow1:rgba(207,227,243,0.13);--glow2:rgba(95,157,184,0.14);--card:rgba(255,255,255,0.06);--card2:rgba(255,255,255,0.025);--card-shadow:none;--line:rgba(255,255,255,0.12);--line2:rgba(255,255,255,0.08);--tx:#F2F4F7;--tx2:#C5CBD3;--tx3:#8E959E;--tx-soft:#E1E5EA;--chip:rgba(255,255,255,0.06);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#CFE3F3;--acc-dot:#CFE3F3;--acc-glow:rgba(207,227,243,0.35);--acc-soft:rgba(207,227,243,0.14);--acc-line:rgba(207,227,243,0.5);--cta:#F2F4F7;--cta-tx:#0D0C0A;--cta-glow:rgba(242,244,247,0.14);--nav:rgba(22,24,28,0.82);--nav-shadow:0 16px 40px rgba(0,0,0,0.45);--ok:#7FD1A6;--ok-tx:#7FD1A6;--ok-soft:rgba(127,209,166,0.14);--ok-glow:rgba(127,209,166,0.22);--ok-line:rgba(127,209,166,0.40);--ylw:#EBD35B;--ylw-tx:#EBD35B;--ylw-soft:rgba(235,211,91,0.13);--ylw-line:rgba(235,211,91,0.42);--ylw-glow:rgba(235,211,91,0.22);--warn:#F0A940;--warn-tx:#F0A940;--warn-soft:rgba(240,169,64,0.15);--warn-glow:rgba(240,169,64,0.24);--warn-line:rgba(240,169,64,0.45);--bad:#F0766B;--bad-tx:#F0766B;--bad-soft:rgba(240,118,107,0.15);--bad-glow:rgba(240,118,107,0.26);--bad-line:rgba(240,118,107,0.45);--grid-line:rgba(242,244,247,0.38);--grid-cell:#100F0D;--grid-mark:rgba(207,227,243,0.55);--overlay:rgba(5,5,6,0.66);--sheet:#15171B;--sheet-line:rgba(255,255,255,0.10);--grid-old:rgba(255,255,255,0.22)}
.tema-claro{--bg:#FAFBFC;--glow1:rgba(207,227,243,0.85);--glow2:rgba(95,157,184,0.12);--card:rgba(255,255,255,0.96);--card2:rgba(244,248,252,0.94);--card-shadow:0 10px 30px rgba(13,12,10,0.06);--line:rgba(13,12,10,0.13);--line2:rgba(13,12,10,0.07);--tx:#0D0C0A;--tx2:#45484D;--tx3:#5F636A;--tx-soft:#1F2124;--chip:rgba(13,12,10,0.04);--acc:#CFE3F3;--acc-tx:#0D0C0A;--acc-text:#2F5E80;--acc-dot:#5B8DB3;--acc-glow:rgba(120,170,210,0.35);--acc-soft:rgba(207,227,243,0.65);--acc-line:#9DC2DE;--cta:#0D0C0A;--cta-tx:#FFFFFF;--cta-glow:rgba(13,12,10,0.18);--nav:rgba(255,255,255,0.9);--nav-shadow:0 14px 34px rgba(13,12,10,0.12);--ok:#3FAE6A;--ok-tx:#1E7B34;--ok-soft:rgba(63,174,106,0.13);--ok-glow:rgba(127,209,166,0.35);--ok-line:rgba(30,123,52,0.30);--ylw:#E2C232;--ylw-tx:#7A6500;--ylw-soft:rgba(226,194,50,0.18);--ylw-line:rgba(122,101,0,0.32);--ylw-glow:rgba(226,194,50,0.30);--warn:#F0A940;--warn-tx:#A05A00;--warn-soft:rgba(240,169,64,0.18);--warn-glow:rgba(240,169,64,0.30);--warn-line:rgba(160,90,0,0.32);--bad:#E0645A;--bad-tx:#C4141B;--bad-soft:rgba(224,100,90,0.13);--bad-glow:rgba(240,118,107,0.25);--bad-line:rgba(196,20,27,0.30);--grid-line:rgba(13,12,10,0.55);--grid-cell:#FFFFFF;--grid-mark:rgba(120,170,210,0.55);--overlay:rgba(13,12,10,0.32);--sheet:#FFFFFF;--sheet-line:rgba(13,12,10,0.08);--grid-old:rgba(13,12,10,0.14)}
</style>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#050506}
#palco{width:1194px;height:834px;flex:none;transform-origin:center center;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.45)}
</style>
<!-- Backend (offline): dados simulados, regras, motor, modelo, armazenamento e ligação aos ecrãs -->
<script src="../dados.js"></script>
<script src="../../motor/regras.js"></script>
<script src="../../motor/motor.js"></script>
<script src="../../motor/modelo.js"></script>
<script src="../armazenamento.js"></script>
<script src="../camara/vendor/mediapipe/face_detection.js"></script>
<script src="../camara/distancia.js"></script>
<script src="ligacao.js"></script>
<script src="voz.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<div id="palco"><div id="raiz"></div></div>
<template id="dc-modelo">
<div class="{{ temaClasse }}" style="position: relative; width: 1194px; height: 834px; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: radial-gradient(45% 55% at 22% 60%, var(--glow1), rgba(0,0,0,0) 70%), radial-gradient(40% 45% at 95% 0%, var(--glow2), rgba(0,0,0,0) 70%), var(--bg)">

<div style="position: absolute; left: 40px; right: 40px; top: 28px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" style="fill: none; stroke: var(--acc-text); stroke-width: 1.6; stroke-linecap: round"><circle cx="14" cy="14" r="5"></circle><path d="M14 2v4M14 22v4M2 14h4M22 14h4M5.5 5.5l2.8 2.8M19.7 19.7l2.8 2.8M5.5 22.5l2.8-2.8M19.7 8.3l2.8-2.8"></path></svg>
<span style="font-size: 22px; font-weight: 500; letter-spacing: -0.3px; color: var(--tx)">Visão</span>
<span style="margin-left: 6px; font-size: 12px; font-weight: 700; color: var(--tx3); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px">{{ selo }}</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{ toggleTema }}" aria-pressed="{{ claro }}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--chip); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<sc-if value="{{ escuro }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{ claro }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
{{ temaLabel }}</button>
<a href="Perfil.html" style="display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px 0 4px; border-radius: 20px; background: var(--chip); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; color: var(--tx); text-decoration: none">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: linear-gradient(135deg, #E6F1FA, #9DC2DE); color: #0D0C0A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ eu.ini }}</span>{{ eu.nome }}<span style="font-weight: 500; color: var(--tx3)">· Dia {{ eu.dia }}</span></a>
</div>
</div>

<header style="position: absolute; left: 40px; right: 40px; top: 84px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; color: var(--tx2)">{{ subtitulo }}</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 400; letter-spacing: -0.6px; color: var(--tx)">{{ passoTitulo }}</h1>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<nav aria-label="Tipo de avaliação" style="display: flex; gap: 4px; padding: 4px; border-radius: 24px; background: var(--chip); border: 1px solid var(--line2)">
<span aria-current="page" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--acc-tx); background: var(--acc)">Testes rápidos</span>
<a href="OCT.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--tx2); text-decoration: none">OCT</a>
<a href="Tendencia.html" style="display: flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--tx2); text-decoration: none">Histórico</a>
</nav>
<button type="button" onClick="{{ abrirAjuda }}" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 8px; border-radius: 22px; border: 1px solid var(--acc-line); background: var(--acc-soft); color: var(--tx); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: var(--acc); color: var(--acc-tx); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">?</span>Ajuda</button>
</div>
</header>

<nav aria-label="Progresso da avaliação" style="position: absolute; left: 40px; top: 152px; width: 1114px; height: 62px">
<span aria-hidden="true" style="position: absolute; left: 139px; top: 15px; width: 836px; height: 2px; border-radius: 1px; background: var(--line)"></span>
<span aria-hidden="true" style="position: absolute; left: 139px; top: 15px; width: {{ progressoPx }}px; height: 2px; border-radius: 1px; background: var(--acc); box-shadow: 0 0 10px var(--acc-glow)"></span>
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{ nos }}" as="n" hint-placeholder-count="4">
<button type="button" onClick="{{ n.ir }}" disabled="{{ n.bloqueado }}" aria-current="{{ n.atualAria }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; font-family: inherit; cursor: {{ n.cursor }}">
<span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid {{ n.borda }}; background: {{ n.fundo }}; color: {{ n.cor }}; box-shadow: {{ n.glow }}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ n.feito }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M6 12.5l4 4 8-9"></path></svg></sc-if>
<sc-if value="{{ n.numero }}" hint-placeholder-val="{{ true }}">{{ n.num }}</sc-if>
</span>
<span style="font-size: 13px; font-weight: {{ n.peso }}; color: {{ n.corLabel }}; text-align: center">{{ n.label }}</span>
</button>
</sc-for>
</div>
</nav>

<sc-if value="{{ p1 }}" hint-placeholder-val="{{ true }}">
<section aria-labelledby="ola-titulo" style="position: absolute; left: 40px; top: 228px; width: 440px; height: 432px; box-sizing: border-box; padding: 22px 24px; border-radius: 26px; background: radial-gradient(100% 60% at 0% 0%, var(--acc-soft), rgba(0,0,0,0) 60%), linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 8px">
<h2 id="ola-titulo" style="margin: 0; font-size: 26px; font-weight: 400; letter-spacing: -0.4px; color: var(--tx)">{{ ola }}</h2>
<p style="margin: 0 0 6px; font-size: 15px; line-height: 1.5; color: var(--tx2)">Vamos fazer o teste rápido da visão. Demora cerca de 5 minutos.</p>
<sc-for list="{{ preparar }}" as="k" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; min-height: 64px; border-top: 1px solid var(--line2)">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--acc-soft); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: var(--acc-text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{ k.icone }}"></path></svg></span>
<span style="font-size: 15px; line-height: 1.4; color: var(--tx-soft)">{{ k.t }}</span>
</div>
</sc-for>
</section>

<section aria-labelledby="perg-titulo" style="position: absolute; left: 496px; top: 228px; width: 658px; height: 432px; box-sizing: border-box; padding: 18px 22px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<h2 id="perg-titulo" style="margin: 0; font-size: 16px; font-weight: 600; color: var(--tx)">Quatro perguntas rápidas sobre os últimos dias</h2>
<span style="font-size: 13px; color: var(--tx3)">Responde Não, Ligeiro ou Marcado.</span>
</div>
<span style="font-size: 12px; font-weight: 700; color: var(--tx2); background: var(--chip); border-radius: 999px; padding: 5px 10px">{{ faltamTxt }}</span>
<button type="button" onClick="{{ tudoNao }}" style="height: 34px; padding: 0 14px; border: 1px solid var(--ok-line); border-radius: 17px; background: var(--ok-soft); color: var(--ok-tx); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Não a tudo</button>
</div>
<sc-for list="{{ perguntas }}" as="q" hint-placeholder-count="4">
<div role="group" aria-label="{{ q.t }}" style="display: flex; align-items: center; gap: 12px; min-height: 66px; border-top: 1px solid var(--line2)">
<span aria-hidden="true" style="width: 22px; height: 22px; flex: none; box-sizing: border-box; border-radius: 6px; border: 2px solid {{ q.caixaBorda }}; background: {{ q.caixaFundo }}; color: var(--acc-tx); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ q.visto }}</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--tx)">{{ q.t }}</span>
<div style="display: flex; gap: 6px">
<sc-for list="{{ q.ops }}" as="op" hint-placeholder-count="3">
<button type="button" onClick="{{ op.pick }}" aria-pressed="{{ op.on }}" style="min-width: 80px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{ op.borda }}; background: {{ op.fundo }}; color: {{ op.cor }}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{ op.t }}</button>
</sc-for>
</div>
</div>
</sc-for>
<div style="flex-grow: 1"></div>
<sc-if value="{{ triagem.on }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--warn-soft); border: 1px solid var(--warn-line)">
<span aria-hidden="true" style="width: 9px; height: 9px; flex: none; border-radius: 5px; background: var(--warn)"></span>
<span style="font-size: 13px; line-height: 1.4; color: var(--tx)">{{ triagem.txt }}</span>
</div>
</sc-if>
</section>
</sc-if>

<sc-if value="{{ p2Intro }}" hint-placeholder-val="{{ false }}">
<section aria-labelledby="ac-intro" style="position: absolute; left: 40px; top: 228px; width: 1114px; height: 432px; box-sizing: border-box; padding: 24px 28px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; gap: 32px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: var(--acc-text)">ANTES DO TESTE · INSTRUÇÕES</span>
<h2 id="ac-intro" style="margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.4px; color: var(--tx)">Teste de acuidade de perto</h2>
<p style="margin: 0 0 6px; font-size: 15px; color: var(--tx2)">Vamos ver até que tamanho de letra consegues ler. Cerca de 1 minuto por olho.</p>
<sc-for list="{{ acPassos }}" as="p" hint-placeholder-count="5">
<div style="display: flex; gap: 12px; align-items: flex-start"><span aria-hidden="true" style="width: 26px; height: 26px; flex: none; border-radius: 13px; background: var(--acc-soft); color: var(--acc-text); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ p.n }}</span><span style="font-size: 15.5px; line-height: 1.45; color: var(--tx); padding-top: 2px">{{ p.t }}</span></div>
</sc-for>
</div>
<div style="width: 340px; flex: none; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 14px 16px; border-radius: 16px; background: var(--acc-soft); font-size: 14px; line-height: 1.45; color: var(--tx)">Se a leitura estiver pior do que da última vez, a app pede-te para leres outra vez com os <b>óculos de reserva</b>. Tenta primeiro sem esforço, como no dia a dia.</div>
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: var(--tx3); margin-top: 4px">VOZ</span>
<div style="display: flex; gap: 6px"><button type="button" onClick="{{ vz.alternarVoz }}" aria-pressed="{{ vz.voz.on }}" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{ vz.voz.borda }}; background: {{ vz.voz.fundo }}; color: {{ vz.voz.cor }}; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>{{ vz.voz.t }}</button><button type="button" onClick="{{ vz.alternarMic }}" aria-pressed="{{ vz.mic.on }}" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{ vz.mic.borda }}; background: {{ vz.mic.fundo }}; color: {{ vz.mic.cor }}; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>{{ vz.mic.t }}</button></div>
<sc-if value="{{ vz.temMsg }}" hint-placeholder-val="{{ false }}"><span role="status" style="font-size: 12.5px; line-height: 1.4; color: var(--tx3)">{{ vz.msg }}</span></sc-if>
<div style="flex-grow: 1"></div>
<button type="button" onClick="{{ comecarAc }}" style="height: 56px; border: 0; border-radius: 26px; background: var(--cta); color: var(--cta-tx); font-family: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 8px 30px var(--cta-glow); font-size: 17px">Começar o teste</button>
</div>
</section>
</sc-if>

<sc-if value="{{ p2Teste }}" hint-placeholder-val="{{ false }}">
<section aria-label="Teste de acuidade de perto" style="position: absolute; left: 40px; top: 228px; width: 1114px; height: 432px; box-sizing: border-box; padding: 16px 20px; border-radius: 26px; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--line2); box-shadow: var(--card-shadow); display: flex; flex-wrap: wrap; gap: 20px">
<div style="flex: 1 1 560px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px; min-height: 34px">
<span style="display: flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--acc-line); background: var(--acc-soft); font-size: 13px; font-weight: 700; color: var(--tx)">{{ acOlhoTxt }}</span>
<span style="font-size: 14px; font-weight: 600; color: var(--tx2)">{{ acSub }}</span>
<span style="flex-grow: 1"></span>
</div>
<sc-if value="{{ acLer }}" hint-placeholder-val="{{ true }}">
<div aria-label="Linha de letras" style="flex-grow: 1; min-width: 250px; min-height: 130px; display: flex; align-items: center; justify-content: center; gap: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid var(--line2)">
<sc-for list="{{ letrasAc }}" as="l" hint-placeholder-count="5">
<span style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span aria-hidden="true" style="font-family: Georgia, 'Times New Roman', serif; font-size: {{ l.size }}px; line-height: 1; color: #0D0C0A">{{ l.t }}</span><span style="width: {{ l.w }}px; height: 5px; border-radius: 3px; background: {{ l.marca }}"></span></span>
</sc-for>
</div>
<div role="status" aria-label="Indicador de acertos" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 44px; box-sizing: border-box; padding: 6px 14px; border-radius: 16px; background: var(--chip); border: 1px solid var(--line2)">

<script>
// Teste de acuidade: 5 linhas de letras Sloan, cada vez mais pequenas.
const LINHAS_AC = [['E'], ['F', 'P'], ['T', 'O', 'Z'], ['L', 'P', 'E', 'D'], ['P', 'E', 'C', 'F', 'D']];
const TAM_AC = [64, 52, 40, 30, 22];
// Teclado: todas as letras que podem aparecer (o astronauta toca na letra que vê).
const TECLAS = ['C', 'D', 'E', 'F', 'L', 'O', 'P', 'T', 'Z'];
// Instruções (aparecem antes do teste e são lidas em voz alta).
const PASSOS_AC = [
  'Mantém a tela a 40 cm, um pouco mais longe do que o ecrã de leitura habitual. A câmara avisa se estiveres perto ou longe demais.',
  'Começamos pelo olho esquerdo: tapa o olho direito com a palma da mão, sem carregar.',
  'Aparece uma linha de letras. Para cada letra, da esquerda para a direita, toca na letra igual no teclado, ou di-la em voz alta com o microfone ligado.',
  'O indicador de acertos mostra quantas letras acertaste. Com a linha completa, toca em Seguinte ou diz «seguinte».',
  'Não aproximes a tela para ver melhor. Se não conseguires ler, toca em Não consigo ler.',
  'Depois repetes com o outro olho.'
];
const PASSOS_AM = [
  'Tapa o olho esquerdo com a palma da mão, sem carregar. Começamos pelo olho direito.',
  'Põe a tela a 33 cm do rosto, mais ou menos o comprimento do antebraço dobrado. A câmara avisa se estiveres perto ou longe demais.',
  'Olha só para o ponto preto no centro. Não mexas os olhos para a grelha.',
  'Sem desviar o olhar, repara se há linhas tortas ou onduladas, zonas desfocadas, escuras ou em falta, ou quadrados de tamanho diferente.',
  'Toca nos quadrados onde viste algo diferente. Se não viste nada, toca em Vejo tudo direito, ou diz «tudo direito».',
  'Depois tapa o olho direito e repete.'
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tema: 'escuro', perfil: 'B', resp: null, passo: 1, max: 1, ajuda: false, real: null, back: null, dist: null,
      intro: { 2: true, 3: true }, voz: window.Voz ? window.Voz.ligada() : false, mic: { estado: 'desligado', mensagem: '' },
      q: [null, null, null, null],
      ac: this.acInicial(),
      am: this.amInicial()
    };
  }
  acInicial() {
    return { eye: 'esq', pass: 'sem', linha: 0, toques: {}, fase: 'ler', resp: [],
      res: { esq: { sem: null, com: null }, dir: { sem: null, com: null } }, semReserva: { esq: false, dir: false },
      // acertos [certas, letras] por olho e por passagem (sem / com os óculos de reserva)
      acertos: { esq: { sem: [0, 0], com: [0, 0] }, dir: { sem: [0, 0], com: [0, 0] } } };
  }
  amInicial() {
    return { eye: 'dir', marks: { dir: {}, esq: {} }, feito: { dir: false, esq: false }, direito: { dir: false, esq: false } };
  }
  componentDidMount() {
    const upd = {};
    try {
      const t = window.localStorage.getItem('visao-tema');
      const p = window.localStorage.getItem('visao-perfil');
      if (t === 'claro' || t === 'escuro') upd.tema = t;
      if (p === 'A' || p === 'B' || p === 'C') upd.perfil = p;
      const r = window.localStorage.getItem('visao-evento-' + (upd.perfil || this.state.perfil));
      if (r === 'sim' || r === 'nao' || r === 'naosei') upd.resp = r;
    } catch (e) {}
    // Perfil real (equipa): a pergunta do movimento da nave é feita em cada teste, não fica guardada de um dia para o outro.
    if (window.Visao && window.Visao.real()) { upd.real = window.Visao.real(); upd.resp = null; }
    this.setState(upd);
    this.ouvir = (ev) => {
      if (!ev) return;
      if (ev.key === 'visao-tema' && (ev.newValue === 'claro' || ev.newValue === 'escuro')) this.setState({ tema: ev.newValue });
      if (ev.key === 'visao-evento-' + this.state.perfil) this.setState({ resp: ev.newValue });
    };
    try { window.addEventListener('storage', this.ouvir); } catch (e) {}
  }
  componentWillUnmount() {
    try { window.removeEventListener('storage', this.ouvir); } catch (e) {}
    if (window.Visao) window.Visao.camara.parar();
    if (window.Voz) { window.Voz.desligarMicrofone(); window.Voz.calar(); }
  }
  // ---------- Voz ----------
  falar(t, semInterromper) { if (window.Voz) window.Voz.falar(t, semInterromper); }
  aoOuvir(texto) {
    if (!window.Voz) return;
    window.Voz.interpretar(texto, TECLAS).forEach((c) => this.comando(c));
  }
  // O mesmo que os botões, mas por voz: letras, «seguinte», «apagar», «não consigo», «tudo direito», «repetir».
  comando(c) {
    const s = this.state;
    if (s.passo === 2) {
      if (s.intro[2]) { if (c.tipo === 'seguinte') this.comecar(2); else if (c.tipo === 'repetir') this.lerIntro(2); return; }
      const a = s.ac;
      if (a.fase === 'ler') {
        if (c.tipo === 'letra') this.responder(c.v);
        else if (c.tipo === 'apagar') this.apagar();
        else if (c.tipo === 'nao_consigo') this.naoConsigo();
        else if (c.tipo === 'seguinte' || c.tipo === 'concluir') this.avancarLinha();
        else if (c.tipo === 'repetir') this.falarAc();
      } else if (a.fase === 'fim' && (c.tipo === 'seguinte' || c.tipo === 'concluir') && !this.piorAgora()) {
        this.setAc((x) => this.avancarOlho(x)); this.falarAc();
      } else if (a.fase === 'feito' && c.tipo === 'seguinte') this.irPara(3);
    } else if (s.passo === 3) {
      if (s.intro[3]) { if (c.tipo === 'seguinte') this.comecar(3); else if (c.tipo === 'repetir') this.lerIntro(3); return; }
      if (c.tipo === 'tudo_direito') this.amTudoDireito();
      else if (c.tipo === 'seguinte' || c.tipo === 'concluir') {

      { cor: 'Amarelo', nivel: 'Interferência potencial', titulo: 'Resultado com condições a confirmar', texto: 'As condições podem ter afectado o resultado. Repete quando puderes.', c: 'var(--ylw-tx)', dot: 'var(--ylw)', glow: 'var(--ylw-glow)', linha: 'var(--ylw-line)' },
      { cor: 'Laranja', nivel: 'Revisão clínica recomendada', titulo: 'Alteração face ao último teste', texto: 'Há uma alteração face ao teu último teste. A equipa médica vai rever.', c: 'var(--warn-tx)', dot: 'var(--warn)', glow: 'var(--warn-glow)', linha: 'var(--warn-line)' },
      { cor: 'Vermelho', nivel: 'Prioridade clínica', titulo: 'Alteração prioritária', texto: 'Apareceu uma zona nova no centro da grelha de Amsler. Avisa já o médico de voo.', c: 'var(--bad-tx)', dot: 'var(--bad)', glow: 'var(--bad-glow)', linha: 'var(--bad-line)' }
    ];
    const hero = Object.assign({}, HER[nivel]);
    if (back) {
      if (back.motivos.length) hero.texto = back.motivos.join(' ');
      else if (nivel === 0) hero.texto = back.primeiro ? 'Primeiro teste guardado como a tua base. Os próximos são comparados com este.' : 'Acuidade, grelha de Amsler e sintomas iguais à tua base.';
      else if (nivel === 1) hero.texto = back.ressalvas.join(' ') + ' Repete quando puderes.';
      else if (nSint) hero.texto = 'Indicaste sintomas. A equipa médica vai rever.';
      if (back.alerta_clinico) hero.texto += ' Marcaste imagens duplas: avisa já o médico de voo.';
      // Modelo pessoal (aprende com os teus testes): avisa quando o teste de hoje foge do teu habitual.
      if (back.modelo && back.modelo.avisos.length) hero.texto += ' Modelo pessoal: ' + back.modelo.avisos.join(' ');
    }
    const usouReserva = ac.res.esq.com !== null || ac.res.dir.com !== null;
    const reservaTxt = ['esq', 'dir'].filter((e) => ac.res[e].com !== null).map((e) => sigla[e] + ' com reserva: ' + curto(ac.res[e].com)).join(' · ');
    const listaSint = s.q.map((x, i) => (x > 0 ? QCURTO[i] + ' (' + OPS[x].toLowerCase() + ')' : null)).filter((x) => x);
    const aconteceu = [
      { teste: 'Acuidade de perto', valor: 'OE ' + curto(ac.res.esq.sem) + ' · OD ' + curto(ac.res.dir.sem),
        sub: 'Acertos: OE ' + ac.acertos.esq.sem[0] + '/' + ac.acertos.esq.sem[1] + ' · OD ' + ac.acertos.dir.sem[0] + '/' + ac.acertos.dir.sem[1] + ' · ' + (reservaTxt ? reservaTxt + ' · ' : '') + (primeiroTeste ? 'Primeiro teste: fica como a tua base' : (antReal ? 'Base (dia ' + antReal.dia + ')' : 'Último teste') + ': OE ' + curto(ant.ac.esq) + ' · OD ' + curto(ant.ac.dir)),
        dot: ac.res.esq.sem === null && ac.res.dir.sem === null ? 'var(--tx3)' : cores[nAc] },
      { teste: 'Sintomas dos últimos dias', valor: listaSint.length === 0 ? 'Nenhum' : (marcados > 0 ? marcados + ' marcado' + (marcados > 1 ? 's' : '') : ligeiros + ' ligeiro' + (ligeiros > 1 ? 's' : '')),
        sub: listaSint.length === 0 ? 'Respondeste Não às quatro perguntas' : listaSint.join(', '), dot: cores[nSint] }
    ];
    const dR = back ? back.distancia : (window.Visao ? window.Visao.camara.resumo() : { n: 0 });
    const distTxt = dR.n > 0 ? 'Média ' + dR.media + ' cm · ' + (100 - dR.foraPct) + '% do tempo no intervalo' : (window.Visao ? 'Não medida pela câmara' : 'Certa nos dois testes');
    const distDot = dR.n > 0 ? (dR.foraPct >= 40 ? 'var(--ylw)' : 'var(--ok)') : (window.Visao ? 'var(--tx3)' : 'var(--ok)');
    const condRes = [
      { k: euReal ? 'Movimento da nave' : 'Evento da nave', v: s.resp ? (euReal ? '' : '10:42–10:43 UTC · ') + respTxt[s.resp] : 'Por responder', dot: s.resp ? (euReal && s.resp !== 'nao' ? 'var(--ylw)' : 'var(--ok)') : 'var(--ylw)' },
      { k: 'Óculos', v: usouReserva ? 'De leitura; reserva no 2.º teste de acuidade' : 'Os de leitura do dia-a-dia', dot: 'var(--ok)' },
      { k: 'Distância', v: distTxt, dot: distDot },
      { k: 'Durante os testes', v: euReal ? (s.resp === 'sim' ? 'Movimento sentido' : 'Sem movimento indicado') : 'Sem eventos da nave', dot: euReal && s.resp === 'sim' ? 'var(--ylw)' : 'var(--ok)' },
      { k: 'Câmara', v: dR.n > 0 ? 'Só mediu a distância · nada gravado' : (window.Visao ? (window.Visao.camara.ultimo().estado === 'sem_cara' ? 'Ligada, mas não viu o teu rosto' : 'Não usada neste teste') : 'Só mediu a distância · nada gravado'), dot: 'var(--acc-text)' }
    ];
    const ACC = [
      ['Segue o calendário normal.', 'Próximo teste rápido daqui a 7 dias.', 'OCT recomendado conforme o protocolo.'],
      ['Repete os testes quando puderes.', 'O resultado fica guardado com a marcação de condições.', 'Se notares alguma mudança na visão, avisa o médico de voo.'],
      ['O resumo vai para revisão da equipa médica.', 'Repete os testes em 2 a 3 dias, ou quando o médico indicar.', 'Se puderes, faz também o OCT e regista o resultado.'],
      ['Avisa já o médico de voo.', 'O pacote com os resultados fica pronto a enviar.', 'Sem contacto? Segue o plano de espera aprovado.']
    ];
    const accTxt = ACC[nivel].slice();
    if (back && nivel !== 1) accTxt[1] = nivel === 0 ? 'Próximo teste rápido daqui a ' + back.proximo_dias + ' dias.' : (nivel === 3 ? accTxt[1] : 'Repete os testes daqui a ' + back.proximo_dias + ' dias, ou quando o médico indicar.');
    if (back) accTxt[2] = nivel === 3 ? accTxt[2] : 'Guardado neste aparelho (teste n.º ' + back.testes + ').';
    const accoes = accTxt.map((t, i) => ({ n: i + 1, t: t }));
    const REV = [
      { t: 'Sem revisão necessária', cor: 'var(--ok-tx)', soft: 'var(--ok-soft)' },
      { t: 'Repetir o teste', cor: 'var(--ylw-tx)', soft: 'var(--ylw-soft)' },
      { t: 'Revisão pendente', cor: 'var(--warn-tx)', soft: 'var(--warn-soft)' },
      { t: 'Revisão prioritária', cor: 'var(--bad-tx)', soft: 'var(--bad-soft)' }
    ];

    // ---------- Passos ----------
    const bloq1 = pendente || faltam > 0;
    const bloq2 = ac.fase !== 'feito';
    const bloq3 = !(am.feito.dir && am.feito.esq);
    const bloqueio = [false, bloq1, bloq1 || bloq2, bloq1 || bloq2 || bloq3];
    const titulos = ['Antes de começar', 'Acuidade visual de perto', 'Grelha de Amsler', 'Resultado'];
    const labels = ['Antes de começar', 'Acuidade', 'Grelha de Amsler', 'Resultado'];
    const nos = labels.map((lb, i) => {
      const n = i + 1;
      const atual = n === s.passo;
      const feitoN = n < s.passo || (n <= s.max && n !== s.passo && n < 4);
      const bloqueado = n > s.max || bloqueio[i];
      return {
        label: lb, num: n,
        feito: feitoN && !atual, numero: !(feitoN && !atual),
        bloqueado: bloqueado,
        atualAria: atual ? 'step' : 'false',
        cursor: bloqueado ? 'default' : 'pointer',
        borda: atual ? 'var(--acc-text)' : (feitoN ? 'var(--acc)' : 'var(--line)'),
        fundo: atual ? 'linear-gradient(var(--acc-soft), var(--acc-soft)), var(--bg)' : (feitoN ? 'var(--acc)' : 'var(--bg)'),
        cor: atual ? 'var(--acc-text)' : (feitoN ? 'var(--acc-tx)' : 'var(--tx3)'),
        glow: atual ? '0 0 18px var(--acc-glow)' : 'none',
        peso: atual ? 700 : 500,
        corLabel: atual ? 'var(--tx)' : (bloqueado ? 'var(--tx3)' : 'var(--tx2)'),
        ir: () => { if (!bloqueado) this.irPara(n); }
      };
    });
    const seguintes = ['Começar · Acuidade', 'Seguinte · Grelha de Amsler', 'Ver resultado'];
    let rodape1 = 'Cerca de 5 minutos no total';
    if (pendente) rodape1 = 'Responde primeiro ao evento da nave';
    else if (faltam > 0) rodape1 = 'Responde a ' + faltam + (faltam === 1 ? ' pergunta' : ' perguntas') + ' para começar';
    const rodapes = [rodape1, '', '', 'Concluído · dia ' + eu.dia + (back ? ' · guardado neste aparelho' : '')];
    const subtitulos = ['Avaliações · cerca de 5 minutos', 'Avaliações · teste 1 de 2 · cerca de 1 minuto por olho', 'Avaliações · teste 2 de 2 · cerca de 1 minuto por olho', 'Avaliações · resultado'];
    const alvoCm = s.passo === 2 ? '40' : '33';
    const dv = s.dist;
    let camara = { t: 'Câmara activa · só mede a distância · nada é gravado', dot: 'var(--acc-text)' };
    let distChip = { t: 'Distância certa · cerca de ' + alvoCm + ' cm', dot: 'var(--ok)' };
    if (window.Visao) {
      if (!dv) { distChip = { t: 'A ligar a câmara… põe o ecrã a ' + alvoCm + ' cm', dot: 'var(--tx3)' }; }
      else if (dv.estado === 'ok') { distChip = { t: 'Distância certa · ' + dv.cm + ' cm', dot: 'var(--ok)' }; }
      else if (dv.estado === 'perto') { distChip = { t: 'Perto demais · ' + dv.cm + ' cm · afasta para ' + alvoCm + ' cm', dot: 'var(--ylw)' }; }
      else if (dv.estado === 'longe') { distChip = { t: 'Longe demais · ' + dv.cm + ' cm · aproxima para ' + alvoCm + ' cm', dot: 'var(--ylw)' }; }
      else if (dv.estado === 'sem_cara') { distChip = { t: 'Não vejo o teu rosto · olha para o ecrã', dot: 'var(--ylw)' }; }
      else { distChip = { t: 'Sem câmara · mede ' + alvoCm + ' cm com o antebraço', dot: 'var(--tx3)' }; camara = { t: 'Câmara indisponível · abre a app por abrir_app para medir a distância', dot: 'var(--tx3)' }; }
    }
    const condicoes = [distChip, camara];
    // Painel da câmara (metade direita do teste): imagem em directo + distância.
    const cam = { cm: '', titulo: 'A ligar a câmara…', dica: 'põe a tela a ' + alvoCm + ' cm', cor: '#D5DAE0', borda: 'var(--line)', ponto: '#9AA3AD',
      selo: 'Câmara · só mede a distância · nada é gravado', semVideo: false, aviso: '' };
    if (!window.Visao || (dv && ['ok', 'perto', 'longe', 'sem_cara'].indexOf(dv.estado) === -1)) {
      Object.assign(cam, { titulo: 'Sem câmara', dica: 'mede ' + alvoCm + ' cm com o antebraço', selo: 'Câmara indisponível', semVideo: true,
        aviso: 'Para veres a câmara e medir a distância, abre a app pelo ficheiro abrir_app e autoriza a câmara no navegador.' });
    } else if (dv) {
      cam.ponto = '#E0554B';
      if (dv.estado === 'ok') Object.assign(cam, { cm: dv.cm + ' cm', titulo: 'Distância certa', dica: '', cor: '#7BD8A0', borda: 'var(--ok)' });
      else if (dv.estado === 'perto') Object.assign(cam, { cm: dv.cm + ' cm', titulo: 'Perto demais', dica: 'afasta para ' + alvoCm + ' cm', cor: '#F2D36B', borda: 'var(--ylw)' });
      else if (dv.estado === 'longe') Object.assign(cam, { cm: dv.cm + ' cm', titulo: 'Longe demais', dica: 'aproxima para ' + alvoCm + ' cm', cor: '#F2D36B', borda: 'var(--ylw)' });
      else Object.assign(cam, { titulo: 'Não vejo o teu rosto', dica: 'olha de frente para a tela', cor: '#F2D36B', borda: 'var(--ylw)' });
    }

    // ---------- Ajuda ----------
    const ajudas = [
      { titulo: 'Antes de começar', meta: 'Cerca de 5 minutos no total',
        passos: ['Se houver um evento de movimento da nave por responder, a app pede-te a resposta primeiro. É obrigatório.', 'Prepara-te: pés presos, tela no velcro à altura dos olhos, óculos de leitura e luz como para ler.', 'Responde às quatro perguntas com Não, Ligeiro ou Marcado.', 'Depois começa pela acuidade.'],
        recs: ['Pensa só nos últimos dias.', 'Não há respostas certas ou erradas.', 'As respostas só vão para a equipa médica.'],
        cuidado: 'Uma mudança súbita ou forte na visão não espera pelo teste: avisa já o médico de voo.' },
      { titulo: 'Acuidade visual de perto', meta: 'Cerca de 1 minuto por olho · teste 1 de 2',
        passos: acPassos.map((p) => p.t),
        recs: ['Tenta primeiro sem esforço, como fazes no dia a dia.', 'Se a leitura estiver pior do que na tua base, a app pede-te um segundo teste com os óculos de reserva.', 'A câmara só mede a distância. Nada é gravado.', 'Com o microfone ligado, podes dizer as letras, «seguinte», «apagar» e «não consigo».'],
        cuidado: 'Se sentires a estação a mexer durante o teste, continua: a app regista e avisa-te se for preciso repetir.' },
      { titulo: 'Grelha de Amsler', meta: 'Cerca de 1 minuto por olho · teste 2 de 2',
        passos: amPassos.map((p) => p.t + (p.itens.length ? ' ' + p.itens.map((x) => x.t).join('; ') + '.' : '')),
        recs: ['Não há resposta certa ou errada. Só interessa o que tu vês.', 'Se vires algo novo, é isso que importa.', 'A app compara com o teu último teste e destaca só o que é novo.'],
        cuidado: 'Se tiveres perda súbita de visão, dor no olho ou flashes de luz, não faças o teste: avisa já o médico de voo.' },
      { titulo: 'Como ler o resultado', meta: 'Quatro níveis',
        passos: ['Verde: rotina. Segue o calendário normal.', 'Amarelo: as condições podem ter afectado o teste. Repete quando puderes.', 'Laranja: alteração face ao último teste. A equipa médica revê.', 'Vermelho: prioridade clínica. Avisa já o médico de voo.'],
        recs: ['O resultado responde a três perguntas: o que aconteceu, em que condições e o que fazer a seguir.', 'Na grelha de Amsler, só as zonas novas aparecem destacadas.'],
        cuidado: 'Este resultado não é um diagnóstico de SANS. Os limites são definidos pela equipa médica antes da missão.' }
    ];
    const aj0 = ajudas[s.passo - 1];
    const aj = { titulo: aj0.titulo, meta: aj0.meta, cuidado: aj0.cuidado,
      passos: aj0.passos.map((t, i) => ({ n: i + 1, t: t })),
      recs: aj0.recs.map((t) => ({ t: t })) };

    const seguinteOff = bloqueio[s.passo] === true;
    // ---------- Voz ----------
    const temVoz = !!(window.Voz && window.Voz.podeFalar());
    const micOn = s.mic.estado === 'a_ouvir' || s.mic.estado === 'a_preparar';
    const chipOn = (on) => ({ fundo: on ? 'var(--acc-soft)' : 'transparent', borda: on ? 'var(--acc-line)' : 'var(--line)', cor: on ? 'var(--acc-text)' : 'var(--tx2)' });
    const vz = {
      voz: Object.assign({ on: temVoz && s.voz, t: !temVoz ? 'Sem voz' : (s.voz ? 'Voz ligada' : 'Voz desligada') }, chipOn(temVoz && s.voz)),
      mic: Object.assign({ on: micOn, t: s.mic.estado === 'a_ouvir' ? 'A ouvir…' : (s.mic.estado === 'a_preparar' ? 'A preparar…' : 'Microfone') }, chipOn(micOn)),
      temMsg: !!s.mic.mensagem && s.mic.estado !== 'desligado',
      msg: s.mic.mensagem,
      alternarVoz: () => { if (!window.Voz) return; const v = window.Voz.alternar(); this.setState({ voz: v }); if (v) this.falar('Voz ligada.'); },
      alternarMic: () => {
        if (!window.Voz) return;
        if (micOn) { window.Voz.desligarMicrofone(); return; }
        window.Voz.ligarMicrofone((t) => this.aoOuvir(t), (e) => this.setState({ mic: e }));
      }
    };
    const claro = s.tema === 'claro';
    return {
      temaClasse: claro ? 'tema-claro' : 'tema-escuro',
      selo: window.Visao ? window.Visao.selo() : 'Dados simulados',
      claro: claro, escuro: !claro,
      temaLabel: claro ? 'Modo escuro' : 'Modo claro',
      toggleTema: () => {
        const n = this.state.tema === 'escuro' ? 'claro' : 'escuro';
        this.setState({ tema: n });
        try { window.localStorage.setItem('visao-tema', n); } catch (e) {}
      },
      eu: eu,
      gate: pendente,
      gateTexto: gateTexto,
      amslerFace: euReal ? 'Grelha de Amsler · face à tua base' : 'Grelha de Amsler · face ao teste anterior',
      gateTitulo: euReal ? 'Movimento da nave' : 'Movimento da nave detectado',
      gateQuando: euReal ? 'Dia ' + eu.dia + ' · antes de começar' : 'Hoje · 10:42–10:43 UTC · 52 s',
      gatePergunta: euReal ? 'Sentiste a estação a mexer ou a vibrar?' : 'Sentiste a estação a mexer ou a vibrar nesse período?',
      gateOps: gateOps,
      abrirEvento: () => { try { window.localStorage.setItem('visao-abrir', 'eventos'); } catch (e) {} },
      p1: s.passo === 1, p2: s.passo === 2, p3: s.passo === 3, p4: s.passo === 4,
      p2Intro: s.passo === 2 && s.intro[2], p2Teste: s.passo === 2 && !s.intro[2],
      p3Intro: s.passo === 3 && s.intro[3], p3Teste: s.passo === 3 && !s.intro[3],
      comecarAc: () => this.comecar(2),
      comecarAm: () => this.comecar(3),
      vz: vz,
      passoTitulo: titulos[s.passo - 1],
      subtitulo: subtitulos[s.passo - 1],
      rodape: rodapes[s.passo - 1],
      comCondicoes: (s.passo === 2 || s.passo === 3) && !!s.intro[s.passo],
      semCondicoes: s.passo === 1 || s.passo === 4,
      condicoes: condicoes,
      cam: cam,
      octNota: euReal ? 'Sem OCT a bordo: o resultado vem só dos testes rápidos, comparados com a tua base.' : 'OCT: opcional, mas recomendado. Mede no aparelho e regista o resultado no separador OCT.',
      nos: nos,
      progressoPx: Math.round((s.passo - 1) / 3 * 836),
      abrirAjuda: () => this.setState({ ajuda: true }),
      fecharAjuda: () => this.setState({ ajuda: false }),
      ajuda: s.ajuda,
      aj: aj,
      // 1
      ola: eu.ola,
      preparar: preparar,
      perguntas: perguntas,
      faltamTxt: faltam === 0 ? 'Tudo respondido' : faltam + ' por responder',
      tudoNao: () => this.setState({ q: [0, 0, 0, 0] }),
      triagem: triagem,
      // 2
      acOlhos: acOlhos,
      acOlhoTxt: nomeOlho[ac.eye] + ' · tapa o ' + outroOlho[ac.eye],
      acerto: acerto,
      teclas: teclas,
      apagar: () => this.apagar(),
      acLer: ac.fase === 'ler', acFim: ac.fase === 'fim', acFeito: ac.fase === 'feito',
      acTitulo: nomeOlho[ac.eye] + ' · tapa o ' + outroOlho[ac.eye],
      acSub: 'Linha ' + (ac.linha + 1) + ' de 5' + (ac.pass === 'com' ? ' · com os óculos de reserva' : ''),
      letrasAc: letrasAc,
      acSegOff: !completa,
      acSegOp: completa ? 1 : 0.45,
      seguinteLinha: () => this.avancarLinha(),
      naoConsigo: () => this.naoConsigo(),
      acFimTitulo: nomeOlho[ac.eye] + (ac.pass === 'com' ? ' com os óculos de reserva: ' : ': ') + (ultimoRes === 0 ? 'não leste nenhuma linha.' : 'leste até à linha ' + ultimoRes + ' de 5.'),
      acFimSub: primeiroTeste ? refTxt + '.' : refTxt + ': ' + linhasTxt(ant.ac[ac.eye]) + '.',
      acPior: pior, acNaoPior: !pior,
      comReserva: () => { this.setAc((a) => Object.assign(a, { pass: 'com', linha: 0, toques: {}, resp: [], fase: 'ler' })); this.falarAc(); },
      semReserva: () => { this.setAc((a) => { const sr = Object.assign({}, a.semReserva); sr[a.eye] = true; return this.avancarOlho(Object.assign(a, { semReserva: sr })); }); this.falarAc(); },
      acAvancar: () => { this.setAc((a) => this.avancarOlho(a)); this.falarAc(); },
      acAvancarLabel: ac.eye === 'esq' ? 'Passar ao olho direito' : 'Concluir a acuidade',
      acResumo: acResumo,
      acRepetir: () => { this.setState({ ac: this.acInicial() }); this.falarAc(); },
      acPassos: acPassos,
      // 3
      cells: cells,
      amOlhos: amOlhos,
      amTitulo: amTitulo,
      amPassos: amPassos,
      tudoDireito: () => this.amTudoDireito(),
      concluirOlho: () => this.amConcluir(),
      concluirOff: nMarcas(am.eye) === 0,
      concluirOp: nMarcas(am.eye) === 0 ? 0.45 : 1,
      // 4
      hero: hero,
      aconteceu: aconteceu,
      mapas: mapas,
      condRes: condRes,
      accoes: accoes,
      revisao: REV[nivel],
      comAlerta: nivel >= 2,
      refazer: () => { if (window.Visao) { window.Visao.camara.parar(); window.Visao.camara.limpar(); } this.setState({ passo: 1, max: 1, q: [null, null, null, null], ac: this.acInicial(), am: this.amInicial(), back: null, dist: null, intro: { 2: true, 3: true }, resp: this.state.real ? null : this.state.resp }); },
      noInicio: s.passo === 1,
      opAnterior: s.passo === 1 ? 0.4 : 1,
      anterior: () => { if (this.state.passo > 1) this.irPara(this.state.passo - 1); },
      temSeguinte: s.passo < 4,
      seguinteOff: seguinteOff,
      opSeguinte: seguinteOff ? 0.45 : 1,
      seguinteLabel: s.passo < 4 ? seguintes[s.passo - 1] : '',
      seguinte: () => {
        if (seguinteOff) return;
        if (this.state.passo < 4) this.irPara(this.state.passo + 1);
      }
    };
  }
}
window.Component = Component;
</script>
</body>
</html>
